name: rollback

on:
  workflow_dispatch:
    inputs:
      version-id:
        description: Worker version ID to roll back to (leave empty for the previous version)
        required: false
      reason:
        description: Why you are rolling back
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Cloudflare credentials
        env:
          DEPLOY_ENVIRONMENT: main
          TOKEN_IN_VARIABLES: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
        run: bash .github/scripts/check-cloudflare-env.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Roll back
        working-directory: apps/web
        env:
          VERSION_ID: ${{ inputs.version-id }}
          REASON: ${{ inputs.reason }}
        run: pnpm exec wrangler rollback $VERSION_ID --yes --message "$REASON"

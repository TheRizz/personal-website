name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: main
      url: https://ry-mart.com
    # CLOUDFLARE_API_TOKEN is set only on the steps that need it, never while dependencies are
    # installed or the site is built (design doc §4.8).
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://ry-mart.com
    steps:
      # The second guard on the publishing App (design doc §4.9.7): a stolen key can merge any PR
      # whose `ci` is green, so a push to main that the App made, or that came from a PR it opened
      # or merged, deploys only if it changes nothing outside content/blog/. Before checkout, so
      # nothing from the repo runs first.
      - name: Keep the publishing App to posts
        env:
          GH_TOKEN: ${{ github.token }}
          BOT: ${{ vars.PUBLISH_BOT }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "$BOT" ]; then
            echo "PUBLISH_BOT isn't set: there is no publishing App yet."
            exit 0
          fi
          people=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '.[] | select(.merged_at != null) | .user.login, (.merged_by.login // "")')
          people+=$'\n'$(gh api "repos/$REPO/commits/$SHA" \
            --jq '(.author.login // ""), (.committer.login // "")')
          if [ "$ACTOR" != "$BOT" ] && ! grep -qxF -- "$BOT" <<<"$people"; then
            echo "The publishing App had no part in $SHA."
            exit 0
          fi
          # A manual run has no previous push to compare with: use the commit's parent.
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')
          fi
          outside=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" \
            --jq '(.files // [])[] | .filename, (.previous_filename // empty)' |
            grep -v '^content/blog/' || true)
          if [ -n "$outside" ]; then
            echo "::error title=The publishing App changed more than posts::Revert $SHA. It changes $(tr '\n' ' ' <<<"$outside")"
            exit 1
          fi
          echo "The publishing App's change only touches content/blog/."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: main
          TOKEN_IN_VARIABLES: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
        run: bash .github/scripts/check-cloudflare-env.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # GITHUB_SHA is baked into the build and reported by /api/health. Nothing here writes
      # .dev.vars: the e2e test identity never reaches a production build.
      - run: pnpm build

      # The owner gate refuses every admin request without OWNER_EMAIL. It was set in Step 10.0,
      # so a missing secret now means something removed it: stop before deploying. Once the
      # publishing App's key is there, PUBLISH_BOT must be too, or the App guards are off.
      - name: Check the Worker secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_BOT: ${{ vars.PUBLISH_BOT }}
        run: |
          if ! secrets=$(pnpm exec wrangler secret list --format json); then
            echo "::warning title=Could not list Worker secrets::OWNER_EMAIL was not checked."
          elif ! jq -e 'any(.[]; .name == "OWNER_EMAIL")' <<<"$secrets" >/dev/null; then
            echo "::error title=OWNER_EMAIL is not set::Run 'pnpm wrangler secret put OWNER_EMAIL' in apps/web (hosting guide §2.9)."
            exit 1
          elif [ -z "$PUBLISH_BOT" ] &&
            jq -e 'any(.[]; .name == "GITHUB_APP_PRIVATE_KEY")' <<<"$secrets" >/dev/null; then
            # Without it, the guards in ci.yml and above can't tell the App's PRs apart.
            echo "::error title=PUBLISH_BOT is not set::The Worker has the publishing App's key. Set the repository variable PUBLISH_BOT to the App's bot login (hosting guide §2.10)."
            exit 1
          fi

      # Before the Worker that needs them. Migrations only ever add (never drop or rename), because
      # `wrangler rollback` restores the Worker but not the database.
      - name: Apply D1 migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply blog --remote

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Smoke test
        id: smoke
        run: |
          for attempt in $(seq 1 10); do
            version=$(curl -fsS "$SITE_URL/api/health" | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ] && curl -fsS -o /dev/null "$SITE_URL/"; then
              echo "Live version is $version"
              if ! curl -fsSI "$SITE_URL/" | grep -qi '^content-security-policy:'; then
                echo "::error::/ has no Content-Security-Policy header"
                exit 1
              fi
              admin=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL/api/admin/me")
              if [ "$admin" = 200 ]; then
                echo "::error::/api/admin/me answered an anonymous request"
                exit 1
              fi
              exit 0
            fi
            echo "Attempt $attempt: live version is '${version:-none}', waiting for $GITHUB_SHA"
            sleep 10
          done
          exit 1

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler rollback --yes --message "Smoke test failed for $GITHUB_SHA"

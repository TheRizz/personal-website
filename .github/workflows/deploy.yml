name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: main
      url: https://ry-mart.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://ry-mart.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Cloudflare credentials
        env:
          DEPLOY_ENVIRONMENT: main
          TOKEN_IN_VARIABLES: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
        run: bash .github/scripts/check-cloudflare-env.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # GITHUB_SHA is baked into the build and reported by /api/health.
      - run: pnpm build

      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      - name: Smoke test
        id: smoke
        run: |
          for attempt in $(seq 1 10); do
            version=$(curl -fsS "$SITE_URL/api/health" | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ] && curl -fsS -o /dev/null "$SITE_URL/"; then
              echo "Live version is $version"
              exit 0
            fi
            echo "Attempt $attempt: live version is '${version:-none}', waiting for $GITHUB_SHA"
            sleep 10
          done
          exit 1

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: apps/web
        run: pnpm exec wrangler rollback --yes --message "Smoke test failed for $GITHUB_SHA"
